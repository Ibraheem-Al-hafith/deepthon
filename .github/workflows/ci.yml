name: Deepthon CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. ADD: the official uv setup action
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      
      # 2. REMOVE: setup-python and pip install steps
      # 3. ADD: Unified workspace installation
      - name: install dependencies
        run: uv sync --all-packages
      
      # 4. MODIFY: Run tests through uv
      - name: Run tests
        run: uv run pytest -q

      # 5. Fix the path for mypy
      - name: Run type checking
        run: uv run mypy deepthon_lib/deepthon